name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The tests use a stand-in for @companion-module/base and Node's built-in test runner,
      # so no packages need to be installed.
      - name: Run tests
        run: node --import ./tests/helpers/register.mjs --test --test-concurrency=1 "tests/**/*.test.mjs"
